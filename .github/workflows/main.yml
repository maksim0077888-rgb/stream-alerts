name: stream-alerts

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stream-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5

      - name: Check streams
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          YT_KEY: ${{ secrets.YT_KEY }}
        run: python3 bot.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "state"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            echo "push failed, retry $i"
            sleep 10
          done
          echo "could not save state, will retry next run"
          exit 0
